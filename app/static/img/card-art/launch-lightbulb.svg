<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Stylized Lightbulb Icon - Circuit Line</title>
  <desc id="desc">A transparent-background SVG of a stylized lightbulb with circuit-like inner lines and radiating accent marks.</desc>
  <defs>
    <linearGradient id="bulbStroke" x1="122" y1="70" x2="390" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="0.52" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="baseStroke" x1="187" y1="339" x2="325" y2="439" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96  0 1 0 0 0.57  0 0 1 0 0.10  0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Energy marks -->
  <g fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.95">
    <path d="M256 34v36"/>
    <path d="M96 104l27 27"/>
    <path d="M416 104l-27 27"/>
    <path d="M52 243h38"/>
    <path d="M422 243h38"/>
  </g>

  <!-- Bulb silhouette -->
  <path d="M256 82c-78 0-142 61-142 136 0 43 20 78 48 105 20 20 31 43 35 70h118c4-27 15-50 35-70 28-27 48-62 48-105 0-75-64-136-142-136Z"
        fill="none" stroke="url(#bulbStroke)" stroke-width="24" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Inner circuit / filament -->
  <g fill="none" stroke="#0f172a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 277v-58c0-17 13-30 30-30h28c17 0 30 13 30 30v58"/>
    <path d="M212 245h-30"/>
    <path d="M300 245h30"/>
    <path d="M242 189v-32"/>
    <path d="M270 189v-32"/>
  </g>

  <!-- Node dots -->
  <g fill="#14b8a6" stroke="#ffffff" stroke-width="6">
    <circle cx="182" cy="245" r="13"/>
    <circle cx="330" cy="245" r="13"/>
    <circle cx="242" cy="157" r="11"/>
    <circle cx="270" cy="157" r="11"/>
  </g>

  <!-- Base -->
  <g fill="none" stroke="url(#baseStroke)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <path d="M196 393h120"/>
    <path d="M207 426h98"/>
    <path d="M226 459h60"/>
  </g>
</svg>
