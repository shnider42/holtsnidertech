<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Mountains, clouds, and sunset - layered scene</title>
  <desc id="desc">A decorative sunset landscape with rolling mountain silhouettes, soft clouds, pine trees, and warm evening colors.</desc>
  <defs>
    <radialGradient id="eveningSky" cx="50%" cy="43%" r="70%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="28%" stop-color="#ffad68"/>
      <stop offset="58%" stop-color="#b85b79"/>
      <stop offset="100%" stop-color="#233858"/>
    </radialGradient>
    <linearGradient id="sunsetDisk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6bd"/>
      <stop offset="52%" stop-color="#ffc25f"/>
      <stop offset="100%" stop-color="#ff6e54"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cloudSoft" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#eveningSky)"/>

  <g opacity="0.42" fill="none" stroke="#fff3c7" stroke-width="3">
    <path d="M245 238c201-80 451-78 646 1"/>
