  <rect x="420" y="398" width="384" height="18" fill="#ff8d63" opacity="0.38"/>
  <rect x="450" y="438" width="324" height="14" fill="#b85b79" opacity="0.28"/>

  <g fill="#fff7e8" filter="url(#cloudSoft)">
    <path d="M122 188c26-43 87-48 120-13 31-26 89-15 105 30 52-1 93 33 97 79H66c3-45 25-78 56-96z" opacity="0.85"/>
    <path d="M826 238c24-33 72-35 96-6 29-16 68-5 82 27 44 0 73 26 78 63H752c2-42 35-74 74-84z" opacity="0.72"/>
    <path d="M444 150c18-28 59-31 82-8 21-13 56-5 66 22 35 0 61 24 64 52H390c2-33 25-58 54-66z" opacity="0.58"/>
