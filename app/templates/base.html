    {% block extra_head %}{% endblock %}
    <script>
        (() => {
            try {
                if (window.localStorage.getItem("holtsnider-theme") === "light") {
                    document.documentElement.dataset.theme = "light";
                    const lightTheme = document.getElementById("light-theme-stylesheet");
                    if (lightTheme) {
                        lightTheme.disabled = false;
                    }
                }

                if (window.localStorage.getItem("holtsnider-reduce-motion") === null) {
                    window.localStorage.setItem("holtsnider-reduce-motion", "true");
                }
            } catch (error) {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>
