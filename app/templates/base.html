<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ business_name }}{% endblock %}</title>
    <meta
        name="description"
        content="{% block meta_description %}Holtsnider Tech provides practical technical consulting, troubleshooting, process improvement, automation, and website/system support for businesses that need clarity and real-world solutions.{% endblock %}"
    />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive-fixes.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staging-polish.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/staging-background-boost.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/desktop-background-flow.css') }}" />
    <link id="light-theme-stylesheet" rel="stylesheet" href="{{ url_for('static', filename='css/warm-canvas-experiment.css') }}" disabled />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-toggle.css') }}" />
    {% block extra_head %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-ht3-flow-layout.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-first-view-system.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-experience-scroll.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-visible-work-cards.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-ht-mark.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-viewport-fade.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-flow-cards.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-guided-flow.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-card-final-tune.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-hero-image-preview.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-choice-context-colors.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-first-screen-bridge.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boston-mobile-tune.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site-flow-clarity.css') }}" />
    <script>
        (() => {
            try {
                if (window.localStorage.getItem("holtsnider-theme") === "light") {
                    document.documentElement.dataset.theme = "light";
                    const lightTheme = document.getElementById("light-theme-stylesheet");
                    if (lightTheme) {
                        lightTheme.disabled = false;
                    }
                }
            } catch (error) {
                document.documentElement.dataset.theme = "dark";
            }
        })();
    </script>
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/boston-site.js') }}"></script>
    <script src="{{ url_for('static', filename='js/boston-nav-cleanup.js') }}"></script>
    <script src="{{ url_for('static', filename='js/boston-experience-scroll.js') }}"></script>
    <script src="{{ url_for('static', filename='js/boston-visible-work-cards.js') }}"></script>
    <script src="{{ url_for('static', filename='js/boston-viewport-fade.js') }}"></script>
    <script src="{{ url_for('static', filename='js/site-flow-clarity.js') }}"></script>
    <script src="{{ url_for('static', filename='js/site-flow-case-links.js') }}"></script>
</body>
</html>
