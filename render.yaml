services:
  - type: web
    name: matthew-granchelli-portfolio
    runtime: python
    plan: free
    branch: matthew-granchelli-site
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SECRET_KEY
        generateValue: true
