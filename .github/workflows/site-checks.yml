name: Site checks

on:
  pull_request:
    branches:
      - staging
      - master
  push:
    branches:
      - staging
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run route tests
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check active JavaScript syntax
        run: |
          node --check app/static/js/boston-site.js
          node --check app/static/js/site-flow-clarity.js
          node --check app/static/js/boston-experience-scroll.js
          node --check app/static/js/boston-visible-work-cards.js
          node --check app/static/js/boston-viewport-fade.js
