services:
  - type: web
    name: peter-musial-engineering
    runtime: static
    rootDir: peter-musial-site
    buildCommand: ""
    staticPublishPath: .
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
